<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Fixture store</title>
    <style>
      body { font-family: sans-serif; background: #f6f1ea; }
      .grid { display: grid; grid-template-columns: repeat(3, 180px); gap: 12px; }
      .product-card, .product-tile { position: relative; background: white; padding: 12px; min-height: 120px; }
    </style>
  </head>
  <body>
    <h1>Fixture beauty shelf</h1>
    <div class="grid product-card-list">
      <article class="product-card">
        <h3 class="product-title">Hydrating serum</h3>
        <p class="product-description">Moisture barrier care for dry skin.</p>
      </article>
      <article class="product-card">
        <h3 class="product-title">Under-eye cream</h3>
        <p class="product-description">Softens the look of dark circles.</p>
      </article>
      <article class="product-tile">
        <h3 class="product-name">Satin lipstick</h3>
        <p class="product-description">A rose shade.</p>
      </article>
    </div>
  </body>
</html>
